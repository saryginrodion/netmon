[project]
name = "netmon"
version = "0.1.0"
description = "Network monitoring utility"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dacite>=1.9.2",
    "fastapi>=0.136.1",
    "msgpack>=1.1.2",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "structlog>=25.5.0",
    "aioquic>=1.2.0",
    "uvicorn>=0.46.0",
    "influxdb3-python>=0.19.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

# All durations / intervals / delays is timedelta.
api:
  port: 8888

# Interval of collection and storing metrics
collect_interval: 2

# Influxdb3 credentials
storage:
  host: http://0.0.0.0:8181
  database: db-1
  token: PASTE_YOUR_SECRET_TOKEN_HERE

# Collectors. Can be multiple collectors of one kind - to test many servers at one run
collectors:
  - type: activetcp
    origin_name: localhost_activetcp  # You can setup custom origin names for collectors
    addr: 127.0.0.1
    port: 8001
    packet_send_delay: 0.1
  - type: activeudp
    origin_name: localhost_activeudp
    addr: 127.0.0.1
    port: 8002
    packet_send_delay: 0.05
  - type: activequic
    origin_name: localhost_activequic
    addr: 127.0.0.1
    port: 8003
    packet_send_delay: 0.2
